
[package]
name = "rust-cli-project"
version = "0.1.0"
edition = "2024"
description = "A streaming AI terminal assistant powered by Rust and Google Gemini"
authors = ["Akshat Kardak"]

[dependencies]
anyhow = "1"
dotenvy = "0.15"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
